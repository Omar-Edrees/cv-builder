<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProfitLens Pro — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--bg2:#0c1018;--surf:#111722;--surf2:#171f2e;--surf3:#1e2840;
  --bdr:rgba(255,255,255,.07);--bdr2:rgba(255,255,255,.13);
  --c1:#00e5a0;--c2:#3b82f6;--red:#f43f5e;
  --txt:#e8edf5;--txt2:#8896ab;--txt3:#3d4f66;
  --mono:'JetBrains Mono',monospace;--head:'Syne',sans-serif;--body:'Outfit',sans-serif;
}
html,body{height:100%;font-family:var(--body);background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%,rgba(0,229,160,.06) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 80%,rgba(59,130,246,.05) 0%,transparent 60%);
  pointer-events:none;
}
.wrap{position:relative;z-index:1;width:100%;max-width:420px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:36px}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--c1);display:flex;align-items:center;justify-content:center}
.brand-mark svg{width:18px;height:18px;fill:none;stroke:#000;stroke-width:2.2;stroke-linecap:round}
.brand-name{font-family:var(--head);font-size:20px;font-weight:700;letter-spacing:-.4px}
.brand-badge{font-size:9px;font-family:var(--mono);background:var(--c1);color:#000;padding:2px 7px;border-radius:3px;font-weight:600}
.card{background:var(--surf);border:1px solid var(--bdr2);border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg2);border-radius:10px;padding:4px;margin-bottom:28px}
.tab{padding:9px;border:none;background:transparent;color:var(--txt2);font-family:var(--body);font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;transition:all .18s}
.tab.active{background:var(--surf3);color:var(--txt)}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:7px;font-weight:500}
.field input{width:100%;height:42px;padding:0 14px;background:var(--bg2);border:1px solid var(--bdr2);border-radius:9px;color:var(--txt);font-family:var(--body);font-size:14px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--c1)}
.field input::placeholder{color:var(--txt3)}
.btn{width:100%;height:44px;border:none;border-radius:10px;background:var(--c1);color:#000;font-family:var(--head);font-size:14px;font-weight:700;cursor:pointer;transition:all .18s;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;display:none}
.btn.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{padding:12px 14px;border-radius:8px;font-size:12px;margin-bottom:18px;display:none}
.msg.error{background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);color:#f87191}
.msg.success{background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.3);color:var(--c1)}
.msg.show{display:block}
.forgot{text-align:right;margin-top:-12px;margin-bottom:18px}
.forgot a{font-size:11px;color:var(--txt2);text-decoration:none;cursor:pointer}
.forgot a:hover{color:var(--c1)}
.footer{text-align:center;margin-top:24px;font-size:11px;color:var(--txt3)}
.footer a{color:var(--txt2);text-decoration:none}
.back-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--txt2);cursor:pointer;margin-bottom:20px;border:none;background:none;padding:0;font-family:var(--body)}
.back-link:hover{color:var(--c1)}
#reset_panel{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 14 14"><polyline points="1,11 5,6 8,9 13,3"/></svg>
    </div>
    <span class="brand-name">ProfitLens</span>
    <span class="brand-badge">PRO</span>
  </div>

  <div class="card">
    <div id="auth_panel">
      <div class="tabs">
        <button class="tab active" id="tab_login" onclick="switchTab('login')">Sign In</button>
        <button class="tab" id="tab_signup" onclick="switchTab('signup')">Create Account</button>
      </div>
      <div id="msg" class="msg"></div>

      <form id="form_login" onsubmit="handleLogin(event)">
        <div class="field"><label>Email</label><input type="email" id="l_email" placeholder="you@example.com" required autocomplete="email"></div>
        <div class="field"><label>Password</label><input type="password" id="l_pass" placeholder="••••••••" required autocomplete="current-password"></div>
        <div class="forgot"><a onclick="showReset()">Forgot password?</a></div>
        <button type="submit" class="btn" id="btn_login">Sign In <span class="spinner"></span></button>
      </form>

      <form id="form_signup" style="display:none" onsubmit="handleSignup(event)">
        <div class="field"><label>Email</label><input type="email" id="s_email" placeholder="you@example.com" required autocomplete="email"></div>
        <div class="field"><label>Password <span style="color:var(--txt3)">(min. 8 chars)</span></label><input type="password" id="s_pass" placeholder="••••••••" required minlength="8" autocomplete="new-password"></div>
        <div class="field"><label>Confirm Password</label><input type="password" id="s_pass2" placeholder="••••••••" required autocomplete="new-password"></div>
        <button type="submit" class="btn" id="btn_signup">Create Account <span class="spinner"></span></button>
      </form>
    </div>

    <div id="reset_panel">
      <button class="back-link" onclick="hideReset()">← Back to sign in</button>
      <div style="margin-bottom:20px">
        <div style="font-family:var(--head);font-size:16px;font-weight:700;margin-bottom:6px">Reset Password</div>
        <div style="font-size:12px;color:var(--txt2)">We'll send a reset link to your email.</div>
      </div>
      <div id="reset_msg" class="msg"></div>
      <form onsubmit="handleReset(event)">
        <div class="field"><label>Email</label><input type="email" id="r_email" placeholder="you@example.com" required></div>
        <button type="submit" class="btn" id="btn_reset">Send Reset Link <span class="spinner"></span></button>
      </form>
    </div>
  </div>

  <div class="footer">By signing in you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a></div>
</div>

<script>
let sb;

(async function init() {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error('Config missing');
    sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    // Already logged in? Go to app
    const { data: { session } } = await sb.auth.getSession();
    if (session) { window.location.replace('/app.html'); return; }
  } catch(e) {
    showMsg('Service unavailable. Please check configuration or try later.', 'error');
    document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  }
})();

async function handleLogin(e) {
  e.preventDefault();
  if (!sb) return;
  const btn = document.getElementById('btn_login');
  setLoading(btn, true);
  hideMsg();
  try {
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById('l_email').value.trim(),
      password: document.getElementById('l_pass').value
    });
    if (error) throw error;
    window.location.replace('/app.html');
  } catch(err) {
    setLoading(btn, false);
    showMsg(err.message || 'Sign in failed. Check your credentials.', 'error');
  }
}

async function handleSignup(e) {
  e.preventDefault();
  if (!sb) return;
  const p1 = document.getElementById('s_pass').value;
  const p2 = document.getElementById('s_pass2').value;
  if (p1 !== p2) { showMsg('Passwords do not match.', 'error'); return; }
  const btn = document.getElementById('btn_signup');
  setLoading(btn, true);
  hideMsg();
  try {
    const { error } = await sb.auth.signUp({
      email: document.getElementById('s_email').value.trim(),
      password: p1
    });
    if (error) throw error;
    setLoading(btn, false);
    showMsg('Account created! Check your email to confirm, then sign in.', 'success');
    switchTab('login');
  } catch(err) {
    setLoading(btn, false);
    showMsg(err.message || 'Sign up failed. Please try again.', 'error');
  }
}

async function handleReset(e) {
  e.preventDefault();
  if (!sb) return;
  const btn = document.getElementById('btn_reset');
  const msgEl = document.getElementById('reset_msg');
  setLoading(btn, true);
  msgEl.className = 'msg';
  try {
    const { error } = await sb.auth.resetPasswordForEmail(
      document.getElementById('r_email').value.trim(),
      { redirectTo: window.location.origin + '/app.html' }
    );
    if (error) throw error;
    setLoading(btn, false);
    msgEl.textContent = 'Reset link sent! Check your inbox.';
    msgEl.className = 'msg success show';
  } catch(err) {
    setLoading(btn, false);
    msgEl.textContent = err.message || 'Failed to send reset link.';
    msgEl.className = 'msg error show';
  }
}

function setLoading(btn, on) {
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('form_login').style.display = isLogin ? '' : 'none';
  document.getElementById('form_signup').style.display = isLogin ? 'none' : '';
  document.getElementById('tab_login').className = 'tab' + (isLogin ? ' active' : '');
  document.getElementById('tab_signup').className = 'tab' + (!isLogin ? ' active' : '');
  hideMsg();
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type + ' show';
}
function hideMsg() { document.getElementById('msg').className = 'msg'; }
function showReset() {
  document.getElementById('auth_panel').style.display = 'none';
  document.getElementById('reset_panel').style.display = '';
}
function hideReset() {
  document.getElementById('reset_panel').style.display = 'none';
  document.getElementById('auth_panel').style.display = '';
}
</script>
</body>
</html>
